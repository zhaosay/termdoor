server {
    listen 80;
    server_name center.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/termdoor-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name center.example.com;
    ssl_certificate /var/lib/termdoor-cert/fullchain.pem;
    ssl_certificate_key /var/lib/termdoor-cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 65m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Avoid recording terminal query strings or one-time credentials.
    access_log off;
    error_log /var/log/nginx/termdoor-center.error.log warn;

    location = /~!frp {
        proxy_pass http://127.0.0.1:17000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:17001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
