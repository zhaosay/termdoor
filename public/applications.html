<!doctype html>
<html lang="zh-CN" data-mode="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>应用与维护 · TermDoor</title><link rel="stylesheet" href="/vendor/zhaoui.css"><link rel="stylesheet" href="/applications.css"><script src="/errors.js"></script><script src="/base.js" defer></script><script src="/token.js" defer></script><script src="/applications.js" defer></script></head>
<body><header><a href="/">TermDoor</a><nav><a href="/online.html">设备接入</a><a href="/">返回终端</a></nav></header><main>
<p class="eyebrow">本机控制台</p><h1>应用与维护</h1><p>在这台电脑设置，线上中心自动同步。凭据只保存在本机。</p>
<details id="auth"><summary>本机验证</summary><form id="auth-form"><label>本机访问令牌<input id="token" type="password" autocomplete="off" required></label><label>二次密钥（如已启用）<input id="key" type="password" autocomplete="off"></label><button>验证</button></form></details>
<p id="message" role="status" aria-live="polite"></p>
<section><div class="heading"><h2>已接入的应用</h2><button id="refresh">刷新状态</button></div><div class="table-scroll"><table><thead><tr><th>序号</th><th>应用</th><th>状态</th><th>操作</th></tr></thead><tbody id="apps"></tbody></table></div><p id="empty" hidden>还没有应用，从下方添加。</p></section>
<section><h2 id="form-title">添加应用</h2><form id="app-form"><div class="fields"><label>标识<input name="id" pattern="[a-z][a-z0-9-]{0,31}" maxlength="32" placeholder="aimini" required></label><label>显示名称<input name="name" maxlength="40" placeholder="我的中枢" required></label><label>应用类型<select name="type"><option value="aimini">AIMini 中枢</option></select></label><label>本机端口<input name="port" type="number" min="1" max="65535" value="8317" required></label><label class="wide">访问密钥文件路径<input name="keyFile" placeholder="选择 AIMini 数据目录中的 access.key 的完整路径" required></label></div><label class="checkbox"><input name="enabled" type="checkbox" checked>允许线上访问</label><p class="hint">目前支持 AIMini。填写密钥文件的位置即可，不要复制密钥内容。测试只检查连接，不执行任务。</p><div class="actions"><button type="submit">保存应用</button><button id="test" type="button">测试连接</button><button id="new-app" type="button">新建</button></div><p id="test-result" role="status"></p></form></section>
<section><h2>服务维护</h2><div class="actions"><button id="check-update">检查更新</button><button id="download">下载诊断</button><button id="copy">复制诊断</button></div><p id="maintenance" role="status"></p><p class="hint">诊断只含版本、运行状态和会话数量，不含密钥、域名、IP、文件路径或终端内容。更新与重启请返回终端的设置菜单。</p></section>
</main></body></html>
